[package]
name = "vhrn-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Network boundary service for vhrn"
repository = "https://github.com/aravind-n/vhrn"
readme = "../README.md"
keywords = ["sandbox", "network"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vhrn-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.49.0", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
vhrn-policy = { path = "../crates/vhrn-policy" }
webpki-roots = "1.0.9"

[dev-dependencies]
tempfile = "3.27.0"
