[package]
name = "vhrn-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Network boundary service for vhrn"
repository = "https://github.com/aravind-n/vhrn"
readme = "../README.md"
keywords = ["sandbox", "network"]
categories = ["development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vhrn-proxy"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
vhrn-policy = { path = "../crates/vhrn-policy" }

[dev-dependencies]
tempfile = "3.27.0"
