# Reusable: build the shipping Go proxy image multi-arch and optionally publish it to
# ghcr. This is the only workflow that owns the production vhrn-proxy image during the
# Rust migration. Tags follow the CLI release clock through flavor and extra_tag.
name: build-proxy-go

on:
  workflow_call:
    inputs:
      flavor:
        description: pr | nightly | release
        type: string
        required: true
      push:
        type: boolean
        default: false
      extra_tag:
        description: an extra raw tag, e.g. the immutable nightly version
        type: string
        default: ''

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-proxy
          tags: |
            type=ref,event=pr,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=nightly,enable=${{ inputs.flavor == 'nightly' }}
            type=sha,prefix=sha-,enable=${{ inputs.flavor == 'nightly' }}
            type=ref,event=tag,enable=${{ inputs.flavor == 'release' }}
            type=raw,value=latest,enable=${{ inputs.flavor == 'release' }}
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}
      - uses: docker/build-push-action@v7
        with:
          context: proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
