# Reusable: build the base and harness images multi-arch and optionally publish them to
# ghcr. Harness images use the base built in the same run by digest. With build_base
# false, the daily refresh uses the existing published latest base. Release callers stage
# images here and promote them separately.
name: build-harness-images

on:
  workflow_call:
    inputs:
      flavor:
        description: ci | pr | release
        type: string
        required: true
      push:
        type: boolean
        default: false
      build_base:
        description: build the base before the harness images
        type: boolean
        default: true
      skip_if_exists:
        description: skip the harness push when its agent version tag already exists
        type: boolean
        default: false
      staging:
        description: push only the supplied temporary staging tags
        type: boolean
        default: false
      staging_tag:
        description: temporary staging tag used when staging is true
        type: string
        default: ''
    outputs:
      staging_tag:
        description: temporary tag pushed by the base and harness staging build
        value: ${{ jobs.base.outputs.staging_tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  base:
    if: ${{ inputs.build_base }}
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      staging_tag: ${{ inputs.staging_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate staging tag
        if: ${{ inputs.staging }}
        env:
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          [[ "$STAGING_TAG" =~ ^staging-[0-9]+-[0-9]+$ ]] || {
            echo "::error::invalid staging tag: $STAGING_TAG"
            exit 1
          }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-base
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }},enable=${{ inputs.staging }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: image/base
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # One job per harness (add aider and friends to the matrix as they land). Each image is
  # probed for its agent version, which becomes both the image tag and the
  # org.opencontainers.image.version label the host reads back.
  harness:
    needs: base
    if: ${{ !cancelled() && inputs.push && needs.base.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - harness: claude
            version_cmd: claude --version
          - harness: codex
            version_cmd: codex --version
          - harness: pi
            version_cmd: pi --version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Prefer the base just built in this run (by digest); the daily refresh uses the
      # published latest base. No base at all: warn and exit 0 so a cron doesn't go red
      # before the first stable base is ever published.
      - id: base
        env:
          REG: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          DIGEST: ${{ needs.base.outputs.digest }}
          HARNESS: ${{ matrix.harness }}
        run: |
          if [ -n "$DIGEST" ]; then
            echo "ref=${REG}/vhrn-base@${DIGEST}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker buildx imagetools inspect "${REG}/vhrn-base:latest" >/dev/null 2>&1; then
            echo "ref=${REG}/vhrn-base:latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::no vhrn-base:latest image — skipping ${HARNESS} build"
          echo "skip=true" >> "$GITHUB_OUTPUT"

      # Probe: build amd64 only (loaded locally, no cache so the agent's unpinned install
      # layer is refetched), run the agent's version command, and parse the semver. The
      # multi-arch push below reuses these layers, so amd64 users get exactly this version.
      - id: probe
        if: ${{ steps.base.outputs.skip != 'true' }}
        env:
          BASE: ${{ steps.base.outputs.ref }}
          HARNESS: ${{ matrix.harness }}
          VERSION_CMD: ${{ matrix.version_cmd }}
        run: |
          docker buildx build --load --no-cache --platform linux/amd64 \
            --build-arg "BASE=${BASE}" --tag "vhrn-${HARNESS}:probe" "image/${HARNESS}"
          read -ra vcmd <<< "$VERSION_CMD"
          raw=$(docker run --rm "vhrn-${HARNESS}:probe" "${vcmd[@]}")
          ver=$(printf '%s' "$raw" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$ver" ] || { echo "::error::no version parsed from: $raw"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "probed ${HARNESS} $ver"

      # Skip-if-unchanged for the harness refresh cron: nothing to do if the agent
      # version is already published. Release leaves skip_if_exists false and rebuilds
      # unconditionally, so a base change still propagates.
      - id: exists
        if: ${{ steps.base.outputs.skip != 'true' && inputs.skip_if_exists }}
        env:
          REG: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ steps.probe.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${REG}/vhrn-${HARNESS}:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::vhrn-${HARNESS}:${VERSION} already published — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        if: ${{ steps.base.outputs.skip != 'true' && steps.exists.outputs.skip != 'true' }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-${{ matrix.harness }}
          flavor: |
            latest=false
          # Harness tags are the agent's version, not vhrn's vX.Y.Z. A staging release
          # pushes only its temporary tag; promotion creates stable tags later. The daily
          # refresh keeps publishing <version>, <version>-<date>, and latest directly.
          tags: |
            type=ref,event=pr,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }},enable=${{ inputs.staging }}
            type=raw,value=${{ steps.probe.outputs.version }},enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=${{ steps.probe.outputs.version }}-${{ steps.date.outputs.date }},enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=latest,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
          # The label the host reads back via inspect — same probed value as the tag.
          labels: |
            org.opencontainers.image.version=${{ steps.probe.outputs.version }}
      - id: build
        if: ${{ steps.base.outputs.skip != 'true' && steps.exists.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: image/${{ matrix.harness }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record staged harness version
        if: ${{ inputs.staging && steps.base.outputs.skip != 'true' && steps.exists.outputs.skip != 'true' }}
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ steps.probe.outputs.version }}
          DATE: ${{ steps.date.outputs.date }}
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          mkdir -p release-input
          {
            echo "harness=$HARNESS"
            echo "version=$VERSION"
            echo "date=$DATE"
            echo "staging_tag=$STAGING_TAG"
          } > "release-input/$HARNESS"
      - if: ${{ inputs.staging && steps.base.outputs.skip != 'true' && steps.exists.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-release-input-${{ matrix.harness }}
          path: release-input/${{ matrix.harness }}
          if-no-files-found: error

  # A non-publishing call cannot consume the multi-platform base by registry digest.
  # Build it locally once, then build every harness against that exact candidate.
  validate-harnesses:
    needs: base
    if: ${{ !cancelled() && !inputs.push && needs.base.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag vhrn-base:ci image/base
      - name: Build harness images
        run: |
          for harness in claude codex pi; do
            docker build --build-arg BASE=vhrn-base:ci --tag "vhrn-${harness}:ci" "image/${harness}"
          done
