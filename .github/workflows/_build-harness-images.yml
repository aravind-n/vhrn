# Reusable: build the base and harness images natively for each architecture and
# optionally publish them to ghcr. Release callers stage images here and promote
# them separately.
name: build-harness-images

on:
  workflow_call:
    inputs:
      flavor:
        description: ci | pr | release
        type: string
        required: true
      push:
        type: boolean
        default: false
      build_base:
        description: build the base before the harness images
        type: boolean
        default: true
      skip_if_exists:
        description: skip the harness push when its agent version tag already exists
        type: boolean
        default: false
      staging:
        description: push only the supplied temporary staging tags
        type: boolean
        default: false
      staging_tag:
        description: temporary staging tag used when staging is true
        type: string
        default: ''
    outputs:
      staging_tag:
        description: temporary tag pushed by the base and harness staging build
        value: ${{ jobs.base-amd64.outputs.staging_tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  base-amd64:
    if: ${{ inputs.build_base }}
    runs-on: ubuntu-24.04
    outputs:
      image_tag: ${{ inputs.staging && format('{0}-amd64', inputs.staging_tag) || inputs.flavor == 'ci' && 'ci-amd64' || format('pr-{0}-amd64', github.event.number) }}
      staging_tag: ${{ inputs.staging && inputs.staging_tag || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate staging tag
        if: ${{ inputs.staging }}
        env:
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          [[ "$STAGING_TAG" =~ ^staging-[0-9]+-[0-9]+$ ]] || {
            echo "::error::invalid staging tag: $STAGING_TAG"
            exit 1
          }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-base
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci-amd64,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,suffix=-amd64,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,suffix=-amd64,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }}-amd64,enable=${{ inputs.staging }}
      - uses: docker/build-push-action@v7
        with:
          context: image/base
          platforms: linux/amd64
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.push && steps.meta.outputs.tags || 'vhrn-base:workflow' }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build harness images
        if: ${{ !inputs.push }}
        run: |
          for harness in claude codex pi; do
            docker build --build-arg BASE=vhrn-base:workflow \
              --tag "vhrn-$harness:workflow" "image/$harness"
          done

  base-arm64:
    if: ${{ inputs.build_base }}
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ inputs.staging && format('{0}-arm64', inputs.staging_tag) || inputs.flavor == 'ci' && 'ci-arm64' || format('pr-{0}-arm64', github.event.number) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate staging tag
        if: ${{ inputs.staging }}
        env:
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          [[ "$STAGING_TAG" =~ ^staging-[0-9]+-[0-9]+$ ]] || {
            echo "::error::invalid staging tag: $STAGING_TAG"
            exit 1
          }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-base
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci-arm64,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,suffix=-arm64,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,suffix=-arm64,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }}-arm64,enable=${{ inputs.staging }}
      - uses: docker/build-push-action@v7
        with:
          context: image/base
          platforms: linux/arm64
          load: ${{ !inputs.push }}
          push: ${{ inputs.push }}
          tags: ${{ inputs.push && steps.meta.outputs.tags || 'vhrn-base:workflow' }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Build harness images
        if: ${{ !inputs.push }}
        run: |
          for harness in claude codex pi; do
            docker build --build-arg BASE=vhrn-base:workflow \
              --tag "vhrn-$harness:workflow" "image/$harness"
          done

  base-manifest:
    needs: [base-amd64, base-arm64]
    if: ${{ !cancelled() && inputs.push && needs.base-amd64.result == 'success' && needs.base-arm64.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-base
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }},enable=${{ inputs.staging }}
      - name: Create multi-architecture image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-base
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE_TAG: ${{ needs.base-amd64.outputs.image_tag }}
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          source_tag="${SOURCE_TAG%-amd64}"
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:$source_tag-amd64" "$IMAGE:$source_tag-arm64"

  # amd64 determines the agent version. arm64 consumes that result, so both native
  # builds carry the same image tags before the manifest is made.
  harness-amd64:
    needs: base-amd64
    if: ${{ !cancelled() && inputs.push && needs.base-amd64.result != 'failure' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            version_cmd: claude --version
          - harness: codex
            version_cmd: codex --version
          - harness: pi
            version_cmd: pi --version
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - id: base
        env:
          PUSH: ${{ inputs.push }}
          REG: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          BASE_TAG: ${{ needs.base-amd64.outputs.image_tag }}
          HARNESS: ${{ matrix.harness }}
        run: |
          if [ "$PUSH" != true ]; then
            docker build --tag vhrn-base:workflow image/base
            echo 'ref=vhrn-base:workflow' >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_TAG" ]; then
            echo "ref=${REG}/vhrn-base:${BASE_TAG}" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "${REG}/vhrn-base:latest" >/dev/null 2>&1; then
            echo "ref=${REG}/vhrn-base:latest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no vhrn-base:latest image — skipping ${HARNESS} build"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - id: probe
        if: ${{ inputs.push && steps.base.outputs.skip != 'true' }}
        env:
          BASE: ${{ steps.base.outputs.ref }}
          HARNESS: ${{ matrix.harness }}
          VERSION_CMD: ${{ matrix.version_cmd }}
        run: |
          docker buildx build --load --no-cache --platform linux/amd64 \
            --build-arg "BASE=${BASE}" --tag "vhrn-${HARNESS}:probe" "image/${HARNESS}"
          read -ra vcmd <<< "$VERSION_CMD"
          raw=$(docker run --rm "vhrn-${HARNESS}:probe" "${vcmd[@]}")
          ver=$(printf '%s' "$raw" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$ver" ] || { echo "::error::no version parsed from: $raw"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "probed ${HARNESS} $ver"
      - id: exists
        if: ${{ inputs.push && steps.base.outputs.skip != 'true' && inputs.skip_if_exists }}
        env:
          REG: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ steps.probe.outputs.version }}
        run: |
          if docker buildx imagetools inspect "${REG}/vhrn-${HARNESS}:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::vhrn-${HARNESS}:${VERSION} already published — nothing to do"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: ${{ inputs.push && steps.base.outputs.skip != 'true' && steps.exists.outputs.skip != 'true' }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-${{ matrix.harness }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci-amd64,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,suffix=-amd64,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,suffix=-amd64,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }}-amd64,enable=${{ inputs.staging }}
            type=raw,value=${{ steps.probe.outputs.version }}-amd64,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=${{ steps.probe.outputs.version }}-${{ steps.date.outputs.date }}-amd64,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=latest-amd64,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
          labels: |
            org.opencontainers.image.version=${{ steps.probe.outputs.version }}
      - id: build
        if: ${{ inputs.push && steps.base.outputs.skip != 'true' && steps.exists.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: image/${{ matrix.harness }}
          platforms: linux/amd64
          push: true
          build-args: |
            BASE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record amd64 result
        if: ${{ always() && inputs.push }}
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ steps.probe.outputs.version }}
          DATE: ${{ steps.date.outputs.date }}
          BASE_SKIP: ${{ steps.base.outputs.skip }}
          EXISTS_SKIP: ${{ steps.exists.outputs.skip }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p harness-input
          if [ "$BASE_SKIP" = true ] || [ "$EXISTS_SKIP" = true ]; then
            echo 'skip=true' > "harness-input/$HARNESS-amd64"
          elif [ "$BUILD_OUTCOME" != success ]; then
            echo 'failure=true' > "harness-input/$HARNESS-amd64"
          else
            { echo 'built=true'; echo "version=$VERSION"; echo "date=$DATE"; } > "harness-input/$HARNESS-amd64"
          fi
      - if: ${{ always() && inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-image-input-${{ matrix.harness }}-amd64
          path: harness-input/${{ matrix.harness }}-amd64
          if-no-files-found: error

  harness-arm64:
    needs: [base-arm64, harness-amd64]
    if: ${{ always() && !cancelled() && inputs.push && needs.base-arm64.result != 'failure' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, pi]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: ${{ inputs.push }}
        uses: actions/download-artifact@v8
        with:
          name: harness-image-input-${{ matrix.harness }}-amd64
          path: harness-input
      - id: input
        if: ${{ inputs.push }}
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          # shellcheck source=/dev/null
          source "harness-input/$HARNESS-amd64"
          if [ "${failure:-false}" = true ]; then
            echo 'failure=true' >> "$GITHUB_OUTPUT"
          elif [ "${skip:-false}" = true ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "date=$date" >> "$GITHUB_OUTPUT"
          fi
      - id: base
        env:
          PUSH: ${{ inputs.push }}
          REG: ${{ env.REGISTRY }}/${{ github.repository_owner }}
          BASE_TAG: ${{ needs.base-arm64.outputs.image_tag }}
          HARNESS: ${{ matrix.harness }}
        run: |
          if [ "$PUSH" != true ]; then
            docker build --tag vhrn-base:workflow image/base
            echo 'ref=vhrn-base:workflow' >> "$GITHUB_OUTPUT"
          elif [ -n "$BASE_TAG" ]; then
            echo "ref=${REG}/vhrn-base:${BASE_TAG}" >> "$GITHUB_OUTPUT"
          elif docker buildx imagetools inspect "${REG}/vhrn-base:latest" >/dev/null 2>&1; then
            echo "ref=${REG}/vhrn-base:latest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no vhrn-base:latest image — skipping ${HARNESS} build"
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        if: ${{ inputs.push && steps.input.outputs.failure != 'true' && steps.input.outputs.skip != 'true' && steps.base.outputs.skip != 'true' }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-${{ matrix.harness }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci-arm64,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,suffix=-arm64,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,suffix=-arm64,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }}-arm64,enable=${{ inputs.staging }}
            type=raw,value=${{ steps.input.outputs.version }}-arm64,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=${{ steps.input.outputs.version }}-${{ steps.input.outputs.date }}-arm64,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=latest-arm64,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
          labels: |
            org.opencontainers.image.version=${{ steps.input.outputs.version }}
      - id: build
        if: ${{ inputs.push && steps.input.outputs.failure != 'true' && steps.input.outputs.skip != 'true' && steps.base.outputs.skip != 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: image/${{ matrix.harness }}
          platforms: linux/arm64
          push: true
          build-args: |
            BASE=${{ steps.base.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record arm64 result
        if: ${{ always() && inputs.push }}
        env:
          HARNESS: ${{ matrix.harness }}
          INPUT_FAILURE: ${{ steps.input.outputs.failure }}
          INPUT_SKIP: ${{ steps.input.outputs.skip }}
          BASE_SKIP: ${{ steps.base.outputs.skip }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          mkdir -p harness-input
          if [ "$INPUT_FAILURE" = true ]; then
            echo 'failure=true' > "harness-input/$HARNESS-arm64"
          elif [ "$INPUT_SKIP" = true ] || [ "$BASE_SKIP" = true ]; then
            echo 'skip=true' > "harness-input/$HARNESS-arm64"
          elif [ "$BUILD_OUTCOME" != success ]; then
            echo 'failure=true' > "harness-input/$HARNESS-arm64"
          else
            echo 'built=true' > "harness-input/$HARNESS-arm64"
          fi
      - if: ${{ always() && inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-image-input-${{ matrix.harness }}-arm64
          path: harness-input/${{ matrix.harness }}-arm64
          if-no-files-found: error

  harness-manifest:
    needs: [harness-amd64, harness-arm64]
    if: ${{ always() && !cancelled() && inputs.push }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, pi]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: harness-image-input-${{ matrix.harness }}-amd64
          path: harness-input
      - uses: actions/download-artifact@v8
        with:
          name: harness-image-input-${{ matrix.harness }}-arm64
          path: harness-input
      - id: input
        env:
          HARNESS: ${{ matrix.harness }}
        run: |
          built=false; version=; date=
          # shellcheck source=/dev/null
          source "harness-input/$HARNESS-amd64"
          amd64_built=$built; amd64_version=$version; amd64_date=$date
          built=false
          # shellcheck source=/dev/null
          source "harness-input/$HARNESS-arm64"
          if [ "$amd64_built" != true ] || [ "$built" != true ]; then
            echo "::notice::vhrn-$HARNESS was not rebuilt"
            exit 0
          fi
          { echo 'built=true'; echo "version=$amd64_version"; echo "date=$amd64_date"; } >> "$GITHUB_OUTPUT"
      - id: meta
        if: ${{ steps.input.outputs.built == 'true' }}
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-${{ matrix.harness }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }},enable=${{ inputs.staging }}
            type=raw,value=${{ steps.input.outputs.version }},enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=${{ steps.input.outputs.version }}-${{ steps.input.outputs.date }},enable=${{ inputs.flavor == 'release' && !inputs.staging }}
            type=raw,value=latest,enable=${{ inputs.flavor == 'release' && !inputs.staging }}
          labels: |
            org.opencontainers.image.version=${{ steps.input.outputs.version }}
      - name: Create multi-architecture image
        if: ${{ steps.input.outputs.built == 'true' }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-${{ matrix.harness }}
          TAGS: ${{ steps.meta.outputs.tags }}
          FLAVOR: ${{ inputs.flavor }}
          STAGING: ${{ inputs.staging }}
          STAGING_TAG: ${{ inputs.staging_tag }}
          VERSION: ${{ steps.input.outputs.version }}
        run: |
          if [ "$STAGING" = true ]; then source_tag=$STAGING_TAG
          elif [ "$FLAVOR" = ci ]; then source_tag=ci
          elif [ "$FLAVOR" = pr ]; then source_tag="pr-${{ github.event.number }}"
          else source_tag=$VERSION; fi
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:$source_tag-amd64" "$IMAGE:$source_tag-arm64"
      - name: Record staged harness version
        if: ${{ inputs.staging && steps.input.outputs.built == 'true' }}
        env:
          HARNESS: ${{ matrix.harness }}
          VERSION: ${{ steps.input.outputs.version }}
          DATE: ${{ steps.input.outputs.date }}
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          mkdir -p release-input
          { echo "harness=$HARNESS"; echo "version=$VERSION"; echo "date=$DATE"; echo "staging_tag=$STAGING_TAG"; } > "release-input/$HARNESS"
      - if: ${{ inputs.staging && steps.input.outputs.built == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: harness-release-input-${{ matrix.harness }}
          path: release-input/${{ matrix.harness }}
          if-no-files-found: error
