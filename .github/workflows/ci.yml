# Pull-request gate. Tests and deliverable builds have separate path selectors; ci-gate
# is the single required status check, so an unselected build may skip without blocking
# the merge. master runs the full suite unfiltered (see nightly.yml).
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      proxy: ${{ steps.filter.outputs.proxy }}
      scripts: ${{ steps.filter.outputs.scripts }}
      test_selected: ${{ steps.filter.outputs.cli == 'true' || steps.filter.outputs.proxy == 'true' || steps.filter.outputs.scripts == 'true' }}
      build_cli: ${{ steps.filter.outputs.build_cli }}
      build_proxy: ${{ steps.filter.outputs.build_proxy }}
      build_harness_images: ${{ steps.filter.outputs.build_harness_images }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Cross.toml'
              - 'shared/testdata/**'
            proxy:
              - 'proxy/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'shared/testdata/**'
            scripts:
              - 'pages/**'
              - 'image/base/entrypoint.sh'
            build_cli:
              - 'cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Cross.toml'
              - 'proxy/Cargo.toml'
              - '.github/workflows/_build-binaries.yml'
            build_proxy:
              - 'proxy/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'cli/Cargo.toml'
              - '.github/workflows/_build-proxy.yml'
            build_harness_images:
              - 'image/base/Dockerfile'
              - 'image/base/entrypoint.sh'
              - 'image/claude/Dockerfile'
              - 'image/codex/Dockerfile'
              - 'image/pi/Dockerfile'
              - '.github/workflows/_build-harness-images.yml'
            workflows:
              - '.github/workflows/**'

  test:
    needs: changes
    uses: ./.github/workflows/_test.yml
    with:
      run_cli: ${{ needs.changes.outputs.cli == 'true' }}
      run_proxy: ${{ needs.changes.outputs.proxy == 'true' }}
      run_scripts: ${{ needs.changes.outputs.scripts == 'true' }}

  build-cli:
    needs: [changes, test]
    if: >-
      ${{
        always() &&
        (
          needs.test.result == 'success' ||
          (needs.test.result == 'skipped' && needs.changes.outputs.test_selected != 'true')
        ) &&
        needs.changes.outputs.build_cli == 'true'
      }}
    uses: ./.github/workflows/_build-binaries.yml
    with:
      version: pr-${{ github.event.number }}

  build-proxy:
    needs: [changes, test]
    if: >-
      ${{
        always() &&
        (
          needs.test.result == 'success' ||
          (needs.test.result == 'skipped' && needs.changes.outputs.test_selected != 'true')
        ) &&
        needs.changes.outputs.build_proxy == 'true'
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-proxy.yml
    with:
      flavor: pr
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  build-harness-images:
    needs: [changes, test]
    if: >-
      ${{
        always() &&
        (
          needs.test.result == 'success' ||
          (needs.test.result == 'skipped' && needs.changes.outputs.test_selected != 'true')
        ) &&
        needs.changes.outputs.build_harness_images == 'true'
      }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-harness-images.yml
    with:
      flavor: pr
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  # Lint the workflows themselves (shellcheck runs on their inline scripts too).
  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - run: ${{ steps.get.outputs.executable }} -color
        shell: bash

  # The one required status check: selected work must succeed; only unselected optional
  # jobs may be skipped.
  ci-gate:
    needs:
      - changes
      - test
      - build-cli
      - build-proxy
      - build-harness-images
      - actionlint
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require selected jobs to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_SELECTED: ${{ needs.changes.outputs.test_selected }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_CLI_SELECTED: ${{ needs.changes.outputs.build_cli }}
          BUILD_CLI_RESULT: ${{ needs['build-cli'].result }}
          BUILD_PROXY_SELECTED: ${{ needs.changes.outputs.build_proxy }}
          BUILD_PROXY_RESULT: ${{ needs['build-proxy'].result }}
          BUILD_HARNESS_IMAGES_SELECTED: ${{ needs.changes.outputs.build_harness_images }}
          BUILD_HARNESS_IMAGES_RESULT: ${{ needs['build-harness-images'].result }}
          ACTIONLINT_SELECTED: ${{ needs.changes.outputs.workflows }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          require_success() {
            name=$1
            result=$2
            if [ "$result" != success ]; then
              echo "$name was required but did not pass: $result"
              exit 1
            fi
          }

          require_optional() {
            name=$1
            selected=$2
            result=$3
            if [ "$selected" = true ]; then
              require_success "$name" "$result"
              return
            fi
            case "$result" in
              success | skipped) ;;
              *) echo "$name was not selected but did not skip cleanly: $result"; exit 1 ;;
            esac
          }

          require_success changes "$CHANGES_RESULT"
          require_optional test "$TEST_SELECTED" "$TEST_RESULT"
          require_optional build-cli "$BUILD_CLI_SELECTED" "$BUILD_CLI_RESULT"
          require_optional build-proxy "$BUILD_PROXY_SELECTED" "$BUILD_PROXY_RESULT"
          require_optional build-harness-images \
            "$BUILD_HARNESS_IMAGES_SELECTED" "$BUILD_HARNESS_IMAGES_RESULT"
          require_optional actionlint "$ACTIONLINT_SELECTED" "$ACTIONLINT_RESULT"
