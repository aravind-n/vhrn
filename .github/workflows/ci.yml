# Pull-request gate. Only changed CLI, proxy candidate, shipping proxy, image, and script
# components are exercised; ci-gate is the single required status check, so a skipped
# component never blocks the merge. master runs the full suite unfiltered (see nightly.yml).
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      proxy_rs: ${{ steps.filter.outputs.proxy_rs }}
      proxy_go: ${{ steps.filter.outputs.proxy_go }}
      images: ${{ steps.filter.outputs.images }}
      scripts: ${{ steps.filter.outputs.scripts }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Cross.toml'
              - 'shared/testdata/**'
            proxy_rs:
              - 'proxy-rs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'shared/testdata/**'
            proxy_go:
              - 'proxy/**'
              - 'shared/testdata/**'
            images:
              - 'image/**'
            scripts:
              - 'pages/**'
              - 'image/base/entrypoint.sh'
            workflows:
              - '.github/workflows/**'

  test:
    needs: changes
    uses: ./.github/workflows/_test.yml
    with:
      run_cli: ${{ needs.changes.outputs.cli == 'true' }}
      run_proxy_rs: ${{ needs.changes.outputs.proxy_rs == 'true' }}
      run_proxy_go: ${{ needs.changes.outputs.proxy_go == 'true' }}
      run_scripts: ${{ needs.changes.outputs.scripts == 'true' }}

  images:
    needs: changes
    if: ${{ needs.changes.outputs.images == 'true' || needs.changes.outputs.proxy_go == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yml
    with:
      flavor: pr
      push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  # Lint the workflows themselves (shellcheck runs on their inline scripts too).
  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash
      - run: ${{ steps.get.outputs.executable }} -color
        shell: bash

  # The one required status check: green iff every job above passed or was skipped.
  ci-gate:
    needs: [changes, test, images, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require green or skipped
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.test.result }}" "${{ needs.images.result }}" "${{ needs.actionlint.result }}"; do
            case "$r" in
              success | skipped) ;;
              *) echo "a required job did not pass: $r"; exit 1 ;;
            esac
          done
