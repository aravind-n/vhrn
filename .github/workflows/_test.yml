# Reusable lint + test for the three code components. Callers pick which run via
# run_*: CI filters by changed paths; nightly and release run all three.
name: test

on:
  workflow_call:
    inputs:
      run_rust:
        type: boolean
        default: true
      run_proxy:
        type: boolean
        default: true
      run_scripts:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  rust:
    if: ${{ inputs.run_rust }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust (latest stable)
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked

  proxy:
    if: ${{ inputs.run_proxy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Latest stable, not go-version-file: go.mod states the floor, and testing on
      # it would pin CI to a toolchain that eventually goes end-of-life.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet and test
        working-directory: proxy
        run: |
          test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      # The stdlib is this binary's only dependency, so a toolchain CVE is the only kind
      # it can have. govulncheck reports the ones actually reachable from our call graph,
      # which beats the toolchain version as a signal. `go install pkg@version` resolves
      # outside the module, so it adds nothing to go.mod.
      - name: Vulnerability scan
        working-directory: proxy
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  scripts:
    if: ${{ inputs.run_scripts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck pages/install.sh image/base/entrypoint.sh
