# Reusable lint + test. Callers pick which components run via run_*: pull-request CI
# filters by changed paths, while master CI and release run the full suite.
name: test

on:
  workflow_call:
    inputs:
      run_cli:
        type: boolean
        default: true
      run_proxy:
        type: boolean
        default: true
      run_scripts:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cli:
    if: ${{ inputs.run_cli }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust (latest stable)
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --package vhrn -- --check
      - run: cargo clippy --package vhrn --all-targets --locked -- -D warnings
      - run: cargo test --package vhrn --locked

  proxy:
    if: ${{ inputs.run_proxy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust (latest stable)
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - run: cargo fmt --package vhrn-proxy -- --check
      - run: cargo clippy --package vhrn-proxy --all-targets --locked -- -D warnings
      - run: cargo test --package vhrn-proxy --locked
      - name: Rust dependency audit
        run: |
          cargo install --locked cargo-audit
          cargo audit --deny warnings
      - run: cargo build --release --locked -p vhrn-proxy
      - name: Release executable process contract
        run: VHRN_PROXY_TEST_BIN="$PWD/target/release/vhrn-proxy" cargo test --package vhrn-proxy --locked --test proxy_process

  scripts:
    if: ${{ inputs.run_scripts }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck pages/install.sh image/base/entrypoint.sh
