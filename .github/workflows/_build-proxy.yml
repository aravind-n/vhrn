# Reusable: smoke and build the production Rust proxy for both platforms.
# Release callers can stage an image for a later, separately-approved promotion.
name: build-proxy

on:
  workflow_call:
    inputs:
      flavor:
        description: ci | pr | release
        type: string
        required: true
      push:
        type: boolean
        default: false
      staging:
        description: push only the supplied temporary staging tag
        type: boolean
        default: false
      staging_tag:
        description: temporary staging tag used when staging is true
        type: string
        default: ''
    outputs:
      staging_tag:
        description: temporary tag pushed by a staging build
        value: ${{ jobs.proxy.outputs.staging_tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  proxy:
    runs-on: ubuntu-latest
    outputs:
      staging_tag: ${{ inputs.staging_tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: vhrn-proxy:workflow-smoke
      - name: Production image smoke
        run: |
          mkdir -p target
          work=$(mktemp -d "$PWD/target/proxy-smoke.XXXXXX")
          name=vhrn-proxy-smoke
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          mkdir -p "$work/policy" "$work/log"
          : > "$work/policy/allowlist"
          printf 'enforce\n' > "$work/policy/mode"
          : > "$work/log/denied.log"
          chmod 0755 "$work" "$work/policy" "$work/log"
          chmod 0666 "$work/log/denied.log"

          test "$(docker image inspect --format '{{.Config.User}}' vhrn-proxy:workflow-smoke)" = 65532:65532
          test "$(docker image inspect --format '{{json .Config.Entrypoint}}' vhrn-proxy:workflow-smoke)" = '["/vhrn-proxy"]'
          test "$(docker image inspect --format '{{json .Config.ExposedPorts}}' vhrn-proxy:workflow-smoke)" = '{"8080/tcp":{}}'
          test "$(docker image inspect --format '{{len .RootFS.Layers}}' vhrn-proxy:workflow-smoke)" -eq 1
          if docker run --rm --entrypoint /bin/sh vhrn-proxy:workflow-smoke -c true >/dev/null 2>&1; then
            echo 'scratch image unexpectedly contains /bin/sh' >&2
            exit 1
          fi

          docker run --detach --rm --name "$name" \
            --read-only --cap-drop ALL \
            --publish 127.0.0.1::8080 \
            --volume "$work/policy:/etc/vhrn:ro" \
            --volume "$work/log:/var/log/vhrn" \
            --env VHRN_ALLOWLIST=/etc/vhrn/allowlist \
            --env VHRN_MODE_FILE=/etc/vhrn/mode \
            --env VHRN_DENY_LOG=/var/log/vhrn/denied.log \
            vhrn-proxy:workflow-smoke
          proxy_port=$(docker port "$name" 8080/tcp | sed -n 's/.*://p')
          for _ in $(seq 1 50); do
            test "$(curl --noproxy '*' --silent --show-error "http://127.0.0.1:$proxy_port/healthz" || true)" = ok && break
            sleep 0.1
          done
          test "$(curl --noproxy '*' --silent --show-error "http://127.0.0.1:$proxy_port/healthz")" = ok
          test "$(curl --noproxy '*' --silent --show-error "http://127.0.0.1:$proxy_port/__status")" = '{"mode":"enforce"}'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}} {{json .HostConfig.CapDrop}} {{len .Mounts}}' "$name")" = 'true ["ALL"] 2'
          docker stop --time 8 "$name"
      - if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Validate staging tag
        if: ${{ inputs.staging }}
        env:
          STAGING_TAG: ${{ inputs.staging_tag }}
        run: |
          [[ "$STAGING_TAG" =~ ^staging-[0-9]+-[0-9]+$ ]] || {
            echo "::error::invalid staging tag: $STAGING_TAG"
            exit 1
          }
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vhrn-proxy
          flavor: |
            latest=false
          tags: |
            type=raw,value=ci,enable=${{ inputs.flavor == 'ci' }}
            type=ref,event=pr,enable=${{ inputs.flavor == 'pr' }}
            type=sha,prefix=pr-${{ github.event.number }}-,format=short,enable=${{ inputs.flavor == 'pr' }}
            type=raw,value=${{ inputs.staging_tag }},enable=${{ inputs.staging }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
