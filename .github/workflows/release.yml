# A vX.Y.Z tag cuts a release: full suite, then — after a maintainer approves the
# `release` environment — the release images and a GitHub Release with the CLI binaries
# and their checksums. Only maintainers can create v* tags (repo ruleset); see
# docs/runbooks/release.md.
name: release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "$crate" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml $crate"; exit 1; }

  # The maintainer gate: the `release` environment's required reviewers pause here,
  # before anything is built or published.
  approve:
    needs: guard
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "release ${GITHUB_REF_NAME} approved"

  test:
    needs: approve
    uses: ./.github/workflows/_test.yml

  build-cli:
    needs: [approve, test]
    uses: ./.github/workflows/_build-binaries.yml
    with:
      version: ${{ github.ref_name }}

  build-proxy:
    needs: [approve, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-proxy.yml
    with:
      flavor: release
      push: true
      staging: true
      staging_tag: staging-${{ github.run_id }}-${{ github.run_attempt }}

  build-harness-images:
    needs: [approve, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-harness-images.yml
    with:
      flavor: release
      push: true
      staging: true
      staging_tag: staging-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    needs:
      - build-cli
      - build-proxy
      - build-harness-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      STAGING_TAG: ${{ needs.build-proxy.outputs.staging_tag }}
    steps:
      - uses: actions/checkout@v7 # for CHANGELOG.md — the release notes source
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: vhrn-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: release-input
          pattern: harness-release-input-*
          merge-multiple: true
      - name: Verify staged release inputs
        env:
          BASE_STAGING_TAG: ${{ needs.build-harness-images.outputs.staging_tag }}
        run: |
          [[ "$STAGING_TAG" =~ ^staging-[0-9]+-[0-9]+$ ]] || {
            echo "::error::invalid proxy staging tag: $STAGING_TAG"
            exit 1
          }
          [ "$STAGING_TAG" = "$BASE_STAGING_TAG" ] || {
            echo "::error::proxy and base staging tags differ"
            exit 1
          }
          for asset in vhrn-darwin-amd64 vhrn-darwin-arm64 vhrn-linux-amd64 vhrn-linux-arm64; do
            [ -f "dist/$asset" ] || { echo "::error::missing CLI artifact: $asset"; exit 1; }
          done
          for harness in claude codex pi; do
            input="release-input/$harness"
            [ -f "$input" ] || { echo "::error::missing staged $harness metadata"; exit 1; }
            grep -qx "harness=$harness" "$input" || { echo "::error::invalid $harness metadata"; exit 1; }
            grep -Eq '^version=[0-9]+\.[0-9]+\.[0-9]+$' "$input" || { echo "::error::invalid $harness version"; exit 1; }
            grep -Eq '^date=[0-9]{8}$' "$input" || { echo "::error::invalid $harness date"; exit 1; }
            grep -qx "staging_tag=$STAGING_TAG" "$input" || { echo "::error::$harness staging tag differs"; exit 1; }
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Confirm staging images
        run: |
          for image in vhrn-proxy vhrn-base vhrn-claude vhrn-codex vhrn-pi; do
            docker buildx imagetools inspect "$REGISTRY/$image:$STAGING_TAG" >/dev/null
          done
      - name: Checksums
        working-directory: dist
        run: sha256sum vhrn-* > SHA256SUMS
      - name: Promote staged images
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/vhrn-proxy:$GITHUB_REF_NAME" \
            --tag "$REGISTRY/vhrn-proxy:latest" \
            "$REGISTRY/vhrn-proxy:$STAGING_TAG"
          docker buildx imagetools create \
            --tag "$REGISTRY/vhrn-base:$GITHUB_REF_NAME" \
            --tag "$REGISTRY/vhrn-base:latest" \
            "$REGISTRY/vhrn-base:$STAGING_TAG"
          for harness in claude codex pi; do
            input="release-input/$harness"
            agent_version=$(sed -n 's/^version=//p' "$input")
            date=$(sed -n 's/^date=//p' "$input")
            docker buildx imagetools create \
              --tag "$REGISTRY/vhrn-$harness:$agent_version" \
              --tag "$REGISTRY/vhrn-$harness:$agent_version-$date" \
              --tag "$REGISTRY/vhrn-$harness:latest" \
              "$REGISTRY/vhrn-$harness:$STAGING_TAG"
          done
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Notes are the tag's own CHANGELOG.md section (## <version> up to the next
          # ## heading or the link-reference block), never GitHub's auto-generated PR
          # list. The heading version is matched with surrounding [brackets] stripped,
          # so both `## X.Y.Z` and Keep a Changelog's `## [X.Y.Z]` work. Fail loudly if
          # the tag has no section rather than falling back to generated notes.
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $1=="##" { h=$2; gsub(/^\[|\]$/, "", h); if (h==ver) {cap=1; next} else if (cap) exit }
            cap && /^\[[^][]+\]:/ {exit}
            cap {print}
          ' CHANGELOG.md | sed '/./,$!d' > notes.md
          [ -s notes.md ] || { echo "::error::no CHANGELOG.md section for ${ver}"; exit 1; }
          # On first publish, create the release with its complete asset set. A rerun keeps
          # using the same staged images and replaces the release body and assets in place.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md dist/*
          fi
